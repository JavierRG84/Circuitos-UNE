name: Bot de lectura Telegram EELH

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions de GitHub

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr el bot
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          TELEGRAM_CANAL: EmpresaElectricaDeLaHabana
        run: python bot/procesar_telegram.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "bot-telegram-eelh"
          git config user.email "bot@users.noreply.github.com"
          git add data/carga.json data/telegram_estado.json data/resumen_telegram.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática desde Telegram [skip ci]"
          git push
